<svg viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cropProfile">
      <rect x="0" y="0" width="600" height="180" rx="20" />
    </clipPath>
  </defs>
  <g clip-path="url(#cropProfile)">
    <rect x="0" y="0" width="600" height="180" fill="#F6E9D8" />

    <!-- sun -->
    <circle cx="524" cy="42" r="36" fill="#E8A33D" opacity="0.18" />
    <circle cx="524" cy="42" r="22" fill="#E8A33D" />

    <!-- floor -->
    <rect x="0" y="142" width="600" height="38" fill="#5F8161" opacity="0.16" />

    <!-- potted plant -->
    <path d="M420 138 L448 138 L444 158 L424 158 Z" fill="#C1543A" />
    <ellipse cx="434" cy="132" rx="8" ry="16" fill="#5F8161" />
    <ellipse cx="422" cy="138" rx="7" ry="13" fill="#5F8161" />
    <ellipse cx="446" cy="138" rx="7" ry="13" fill="#5F8161" />

    <!-- chair -->
    <rect x="95" y="72" width="96" height="62" rx="16" fill="#8A3A3A" />
    <rect x="88" y="122" width="112" height="20" rx="8" fill="#8A3A3A" />
    <rect x="86" y="138" width="10" height="26" rx="3" fill="#8A3A3A" />
    <rect x="192" y="138" width="10" height="26" rx="3" fill="#8A3A3A" />

    <!-- person -->
    <ellipse cx="146" cy="118" rx="26" ry="30" fill="#C1543A" />
    <circle cx="146" cy="76" r="17" fill="#F6E9D8" stroke="#8A3A3A" stroke-width="3" />

    <!-- teacup in hand -->
    <ellipse cx="188" cy="120" rx="10" ry="7" fill="#FDF6EC" stroke="#C1543A" stroke-width="2" />
    <path d="M198 120 q8 0 8 7 q0 6 -8 6" fill="none" stroke="#C1543A" stroke-width="2" />

    <!-- small heart of care, floating above -->
    <path d="M146 44 c-4 -6 -14 -3 -14 4 c0 6 8 11 14 15 c6 -4 14 -9 14 -15 c0 -7 -10 -10 -14 -4 Z" fill="#5F8161" opacity="0.85" />

    <!-- decorative dots -->
    <circle cx="260" cy="50" r="4" fill="#C1543A" opacity="0.35" />
    <circle cx="290" cy="34" r="3" fill="#8A3A3A" opacity="0.3" />
    <circle cx="320" cy="58" r="3.5" fill="#5F8161" opacity="0.3" />
  </g>
</svg>

<svg viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cropDiet">
      <rect x="0" y="0" width="600" height="180" rx="20" />
    </clipPath>
  </defs>
  <g clip-path="url(#cropDiet)">
    <rect x="0" y="0" width="600" height="180" fill="#F6E9D8" />

    <!-- table line -->
    <rect x="0" y="150" width="600" height="30" fill="#C1543A" opacity="0.10" />

    <!-- glass of milk -->
    <path d="M470 96 L482 150 L516 150 L528 96 Z" fill="#FDF6EC" stroke="#8A3A3A" stroke-width="2.5" />
    <path d="M472 108 L526 108 L520 150 L478 150 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- plate -->
    <circle cx="240" cy="110" r="66" fill="#8A3A3A" opacity="0.12" />
    <circle cx="240" cy="104" r="66" fill="#FDF6EC" stroke="#C1543A" stroke-width="4" />
    <circle cx="240" cy="104" r="52" fill="#FFFFFF" />

    <!-- roti (round bread) -->
    <circle cx="204" cy="92" r="24" fill="#E8A33D" opacity="0.85" />

    <!-- dal / lentils -->
    <ellipse cx="266" cy="88" rx="22" ry="18" fill="#C1543A" opacity="0.8" />

    <!-- sabzi / greens -->
    <ellipse cx="222" cy="128" rx="24" ry="16" fill="#5F8161" />
    <ellipse cx="264" cy="126" rx="18" ry="13" fill="#5F8161" opacity="0.75" />

    <!-- paneer cubes for protein -->
    <rect x="248" y="104" width="12" height="12" rx="2" fill="#FDF6EC" stroke="#E8A33D" stroke-width="2" />
    <rect x="262" y="110" width="12" height="12" rx="2" fill="#FDF6EC" stroke="#E8A33D" stroke-width="2" />

    <!-- leaf accents -->
    <path d="M96 46 q14 -18 28 0 q-14 10 -28 0 Z" fill="#5F8161" opacity="0.5" />
    <path d="M120 60 q14 -18 28 0 q-14 10 -28 0 Z" fill="#5F8161" opacity="0.35" />

    <!-- small orange/fruit -->
    <circle cx="86" cy="118" r="16" fill="#E8A33D" />
    <path d="M86 102 q4 -6 8 -2" fill="none" stroke="#5F8161" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
